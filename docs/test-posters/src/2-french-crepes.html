<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:800px;height:1100px;overflow:hidden}
  body{font-family:Georgia,serif;background:#fff6ec;color:#22305e;position:relative}
  .stripes{position:absolute;top:0;left:0;right:0;height:26px;background:linear-gradient(90deg,#22305e 0 33%,#fff 33% 66%,#d8343f 66%)}
  .soc{margin-top:80px;text-align:center;font-size:26px;letter-spacing:4px;font-style:italic}
  h1{text-align:center;font-size:92px;line-height:1.05;margin:20px 0 0;color:#d8343f;font-weight:400;font-family:"Segoe Script","Brush Script MT",cursive}
  .crepe{width:220px;height:220px;margin:24px auto;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f7d38c,#e2a54b 70%,#b97a2a);box-shadow:0 20px 40px #0002;display:flex;align-items:center;justify-content:center;font-size:70px}
  .when{text-align:center;font-size:44px;font-weight:700;margin-top:10px}
  .when span{display:block;font-size:28px;font-weight:400;font-style:italic;color:#555}
  .where{text-align:center;font-size:34px;margin-top:26px}
  .prix{margin:40px auto 0;width:560px;border:3px dashed #22305e;padding:18px;text-align:center;font-size:28px;line-height:1.5}
  .foot{position:absolute;bottom:28px;width:100%;text-align:center;font-size:14px;color:#999;font-family:Arial}
</style></head><body>
  <div class="stripes"></div>
  <div class="soc">— French Society présente —</div>
  <h1>Soirée Crêpes</h1>
  <div class="crepe">🥞</div>
  <div class="when">CE JEUDI · 19h<span>(this Thursday, 7pm)</span></div>
  <div class="where">📍 Global Lounge</div>
  <div class="prix">Gratuit pour les membres<br>€2 pour les non-membres</div>
  <div class="foot">Fictional demo poster · SocSync test set</div>
</body></html>
