<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:800px;height:1100px;overflow:hidden}
  body{background:radial-gradient(circle at 50% 30%,#2a2218,#0b0907 70%);color:#d9b56a;font-family:Georgia,serif;position:relative;text-align:center}
  .frame{position:absolute;inset:30px;border:2px solid #d9b56a55;outline:1px solid #d9b56a33;outline-offset:-14px}
  .presents{margin-top:90px;font-size:22px;letter-spacing:8px;text-transform:uppercase;color:#bfa36a}
  h1{font-family:"Segoe Script","Brush Script MT",cursive;font-size:96px;line-height:1.1;font-weight:400;margin:24px 0 0;color:#f0d08a;text-shadow:0 0 30px #d9b56a55}
  .mask{font-size:80px;margin:6px 0}
  .date{font-size:128px;letter-spacing:6px;font-weight:300;margin:0;color:#f0d08a}
  .times{font-size:26px;letter-spacing:3px;margin-top:20px;line-height:1.8}
  .venue{font-size:30px;font-style:italic;margin-top:30px}
  .tix{margin-top:44px;font-size:24px;letter-spacing:5px;text-transform:uppercase}
  .foot{position:absolute;bottom:40px;width:100%;font-size:13px;color:#6d5a3a;font-family:Arial}
</style></head><body>
  <div class="frame"></div>
  <div class="presents">The Engineering Society presents</div>
  <h1>Masquerade Ball</h1>
  <div class="mask">🎭</div>
  <div class="date">31.10</div>
  <div class="times">DOORS 19:30 · DINNER 20:00 · CARRIAGES 01:00</div>
  <div class="venue">Clayton Hotel, Burlington Road</div>
  <div class="tix">Tickets €35 · Black tie</div>
  <div class="foot">Fictional demo poster · SocSync test set</div>
</body></html>
