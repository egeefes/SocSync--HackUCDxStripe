<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:800px;height:1100px;overflow:hidden}
  body{font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(#bfe3d0 0%,#e9f5ee 55%,#fff 100%);color:#123b2a;position:relative}
  svg{position:absolute;top:330px;left:0}
  .top{padding:60px 60px 0;text-align:center}
  .club{letter-spacing:6px;font-size:22px;font-weight:600;color:#2f6b4f}
  h1{font-size:92px;line-height:.95;margin:24px 0 0;font-weight:900;color:#0f3d2a}
  .info{position:absolute;bottom:120px;left:60px;right:60px;background:#0f3d2a;color:#fff;border-radius:24px;padding:36px 44px;font-size:30px;line-height:1.5}
  .info b{color:#a7e3c3}
  .price{position:absolute;top:290px;right:50px;background:#f2b134;color:#3b2500;width:170px;height:170px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:44px;transform:rotate(10deg)}
  .price small{font-size:16px;font-weight:600;text-align:center}
  .foot{position:absolute;bottom:28px;width:100%;text-align:center;font-size:14px;color:#6b8c7c}
</style></head><body>
  <div class="top">
    <div class="club">MOUNTAINEERING CLUB</div>
    <h1>GLENDALOUGH<br>DAY HIKE</h1>
  </div>
  <div class="price">€15<small>includes<br>return bus</small></div>
  <svg width="800" height="420" viewBox="0 0 800 420"><polygon points="0,420 180,140 300,300 430,90 600,320 700,200 800,300 800,420" fill="#4f8f6c"/><polygon points="0,420 120,280 260,380 420,240 560,360 800,260 800,420" fill="#2f6b4f"/><polygon points="410,105 430,90 452,118 440,112 428,124 418,112" fill="#fff"/></svg>
  <div class="info">
    <b>Saturday 24 October</b><br>
    Bus departs 9:00 · back by 18:00<br>
    Meet at the main entrance, Belfield<br>
    40 places · bring lunch &amp; rain gear
  </div>
  <div class="foot">Fictional demo poster · SocSync test set</div>
</body></html>
